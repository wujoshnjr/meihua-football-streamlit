name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Rebuild pinned Yilin corpus
        run: python tools/import_yilin_kanripo.py
      - name: Verify committed Yilin corpus is reproducible
        run: git diff --exit-code -- knowledge/yilin/entries knowledge/yilin/manifest.json knowledge/yilin/source_snapshot.json
      - name: Materialize pinned Zhouyi corpus
        run: python tools/import_zhouyi_kanripo.py
      - name: Validate Zhouyi corpus
        run: python tools/validate_zhouyi.py
      - name: Upload generated Zhouyi corpus for review
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-corpus
          path: knowledge/zhouyi
      - name: Commit reproducible Zhouyi corpus to agent branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          if git diff --quiet -- knowledge/zhouyi; then
            echo "Zhouyi corpus already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/zhouyi/corpus.json knowledge/zhouyi/manifest.json
          git commit -m "Materialize pinned Zhouyi 64/384 corpus"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: ruff check .
      - run: python -m pytest -q
      - run: python tools/validate_knowledge.py
      - run: python tools/validate_yilin.py
