name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild pinned Yilin corpus with bounded retry
        run: python tools/run_with_retry.py --attempts 4 --backoff-seconds 2 -- python tools/import_yilin_kanripo.py
      - name: Verify committed Yilin corpus is reproducible
        run: git diff --exit-code -- knowledge/yilin/entries knowledge/yilin/manifest.json knowledge/yilin/source_snapshot.json
      - name: Rebuild pinned Zhouyi corpus with bounded retry
        run: python tools/run_with_retry.py --attempts 4 --backoff-seconds 2 -- python tools/import_zhouyi_kanripo.py
      - name: Verify committed Zhouyi corpus is reproducible
        run: git diff --exit-code -- knowledge/zhouyi/entries knowledge/zhouyi/manifest.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Validate Zhouyi textual corpus
        run: python tools/validate_zhouyi.py
      - name: Validate Zhouyi semantic review
        run: python tools/validate_zhouyi_semantics.py
      - name: Validate Zhouyi 384-line conditional meaning review
        run: python tools/validate_zhouyi_line_meaning_review.py
      - name: Validate deep divination review contract
        run: python tools/validate_divination_review.py
      - name: Validate Meihua classical method audit
        run: python tools/validate_meihua_classical_method.py
      - name: Validate Meihua temporal precision
        run: python tools/validate_meihua_temporal_precision.py
      - name: Validate Meihua cross-system coherence
        run: python tools/validate_meihua_coherence.py
      - name: Validate Qimen source-derived golden fixtures
        run: python tools/validate_qimen_source_golden.py
      - name: Validate Qimen extended relations
        run: python tools/validate_qimen_extended_review.py
      - name: Validate Qimen golden / extended review gates
        run: python tools/validate_qimen_review_gates.py
      - name: Validate Yuanling Yanshu / Ri-Qimen source contract
        run: python tools/validate_yuanling.py
      - name: Validate expanded Yuanling source database and method reference
        run: python tools/validate_yuanling_expanded.py
      - name: Validate Liuyao Najia source contract
        run: python tools/validate_liuyao.py
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q
      - name: Validate knowledge catalog
        run: python tools/validate_knowledge.py
      - name: Validate Yilin runtime catalog
        run: python tools/validate_yilin.py

  release-gate:
    if: always()
    needs: [source-reproducibility, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          SOURCE_RESULT: ${{ needs.source-reproducibility.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "source-reproducibility=${SOURCE_RESULT}"
          echo "test=${TEST_RESULT}"
          test "${SOURCE_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
