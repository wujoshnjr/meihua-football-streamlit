name: Apply verified v7.2.0 rebuild

on:
  push:
    branches:
      - agent/jarvis-v7-2-rebuild

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage verified v7.2.0 rebuild')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify v7.2.0 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree_sha='e91df991714e28a53288700477bcb50389e40ca8'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/git/trees/${tree_sha}?recursive=1" > /tmp/tree.json

          jq -r '.tree[] | select(.path | startswith(".release/v720.")) | [.path, .sha] | @tsv' /tmp/tree.json \
            | sort > /tmp/payload-blobs.tsv
          test "$(wc -l < /tmp/payload-blobs.tsv)" -eq 56

          : > /tmp/v720.b64
          while IFS=$'\t' read -r path sha; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> /tmp/v720.b64
          done < /tmp/payload-blobs.tsv

          for sha in \
            76682148a91acf44f50bae6363cee765bc4dea8c \
            6c11c66b2bfe4c5e7824d8a21748f1eebdd175d5 \
            1926f4e9034bd7131ff262f97285672163c77658
          do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> /tmp/v720.b64
          done

          base64 -d /tmp/v720.b64 > /tmp/v720.tar.xz
          echo 'e01c2e1c3f61e48e99c79a52845090ffa37f9687db8babcfecc06bf88a9da5c8  /tmp/v720.tar.xz' | sha256sum -c -

          mkdir -p /tmp/v720
          tar -xJf /tmp/v720.tar.xz -C /tmp/v720
          grep -q '__version__ = "7.2.0"' /tmp/v720/meihua-football-streamlit/version.py

      - name: Replace branch tree with verified v7.2.0
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/v720/meihua-football-streamlit/ ./

      - name: Preserve canonical_json public re-export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('qimen/reporting.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .integrity import canonical_json, sha256_payload'
          new = 'from .integrity import canonical_json as canonical_json, sha256_payload'
          if old not in text:
              raise SystemExit('Expected v7.2 reporting import was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate rebuilt v7.2.0
        run: |
          ruff check .
          python -m pytest -q
          python tools/validate_knowledge.py

      - name: Commit verified v7.2.0 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'Upgrade to JARVIS v7.2.0'
          git push origin HEAD:agent/jarvis-v7-2-rebuild
